{% comment %}
Prelievi <template> elements — cloned by JS on mount().
user.can_modify and S (string constants) are provided by the shell's
render context.
{% endcomment %}

<template id="tmpl-prelievi-page">
  <div class="prelievi-filter-bar">
    <span class="table-search-label">Anni</span>
    <div class="prelievi-slider-controls">
      <span class="prelievi-slider-label"></span>
      <div class="range-slider">
        <input type="range" data-role="slider-min">
        <input type="range" data-role="slider-max">
      </div>
    </div>
    <label class="table-search-label" for="prelievi-search">{{ S.FILTER_LABEL }}</label>
    <input type="text" class="table-search" id="prelievi-search"
           placeholder="{{ S.SEARCH_PLACEHOLDER }}">
    <button type="button" class="btn"
            data-action="reset-filters">{{ S.PRELIEVI_RESET_FILTERS }}</button>
    <button type="button" class="btn btn-export ms-auto"
            data-action="export-csv">{{ S.EXPORT }}</button>
    {% if user.can_modify %}
    <button type="button" class="btn btn-import"
            data-action="import-csv">{{ S.IMPORT_CSV }}</button>
    <button type="button" class="btn btn-create btn-add"
            data-action="add">+ Aggiungi</button>
    {% endif %}
  </div>

  {% include "base/_partials/_collapsible_header.html" with section="a" title=S.PRELIEVI_SECTION_SUMMARY %}
  <div class="collapsible-body" data-section="a">
    <div class="prelievi-summary-grid">
      <section class="prelievi-chart-panel">
        <h2 class="prelievi-chart-title">{{ S.PRELIEVI_CHART_BY_YEAR }}</h2>
        <div class="chart-controls">
          <select data-role="year-breakdown-select">
            <option value="total">{{ S.CHART_TOTAL }}</option>
            <option value="compresa">{{ S.COL_REGION }}</option>
            <option value="particella">{{ S.COL_PARCEL }}</option>
            <option value="squadra">{{ S.COL_CREW }}</option>
            <option value="specie">{{ S.COL_SPECIES }}</option>
            <option value="trattore">{{ S.LABEL_TRACTOR_NAME }}</option>
            <option value="tipo">{{ S.COL_TYPE }}</option>
          </select>
          <label class="chart-month-toggle">
            <input type="checkbox" data-role="month-toggle"> {{ S.PRELIEVI_CHART_MONTHS }}
          </label>
        </div>
        <div class="chart-container"><canvas data-target="chart-a"></canvas></div>
      </section>
      <section class="prelievi-chart-panel">
        <h2 class="prelievi-chart-title">{{ S.PRELIEVI_CHART_BY_PARCEL }}</h2>
        <div class="chart-controls">
          <select data-role="parcel-breakdown-select">
            <option value="total">{{ S.CHART_TOTAL }}</option>
            <option value="squadra">{{ S.COL_CREW }}</option>
            <option value="specie">{{ S.COL_SPECIES }}</option>
            <option value="trattore">{{ S.LABEL_TRACTOR_NAME }}</option>
            <option value="tipo">{{ S.COL_TYPE }}</option>
          </select>
        </div>
        <div class="chart-container"><canvas data-target="chart-b"></canvas></div>
      </section>
    </div>
  </div>

  {% include "base/_partials/_collapsible_header.html" with section="b" title=S.PRELIEVI_SECTION_CALENDAR %}
  <div class="collapsible-body" data-section="b">
    <div class="prelievi-calendar-wrap" data-target="calendar-host"></div>
  </div>

  {% include "base/_partials/_collapsible_header.html" with section="i" title=S.PRELIEVI_SECTION_HARVESTS %}
  <div class="collapsible-body" data-section="i" data-target="table-host">
  </div>
</template>

<template id="tmpl-prelievi-import-csv-modal">
  <div class="form-card">
    <h2>{{ S.IMPORT_CSV }}</h2>
    <form data-role="import-form">
      <div class="form-group">
        <label for="prelievi-csv-file">{{ S.LABEL_CSV_FILE }}</label>
        <input type="file" id="prelievi-csv-file" name="file"
               accept=".csv,text/csv" required>
      </div>
      {% include "base/_partials/_csv_import_tail.html" %}
    </form>
  </div>
</template>
