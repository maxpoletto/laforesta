<section data-settings-section="{{ key }}" data-settings-entity>
  {% include "base/_partials/_collapsible_header.html" with section="" title=title %}
  <div class="collapsible-body">
    {% if not hide_active_filter %}
    <div class="table-toolbar">
      <label class="active-toggle ms-auto">
        <input type="checkbox" data-role="active-toggle" checked>
        Solo attivi
      </label>
    </div>
    {% endif %}
    <div data-target="table-host"></div>
    {% if usage_note %}<p class="text-muted">{{ usage_note }}</p>{% endif %}
  </div>
</section>
