{% comment %}
Impostazioni <template> elements — cloned by JS on mount().
S (string constants) provided by the shell's render context.
{% endcomment %}

<template id="tmpl-impostazioni-page">
  {% if user.can_modify %}
    <nav class="settings-nav" aria-label="Impostazioni">
      <a href="/impostazioni" aria-controls="settings-generali">Generali</a>
      <a href="/impostazioni?scheda=dati-di-base" aria-controls="settings-dati-di-base">Dati di base</a>
      <a href="/impostazioni?scheda=cartografia" aria-controls="settings-cartografia">Cartografia</a>
    </nav>
  {% endif %}

  <div id="settings-generali" class="settings-forms" data-settings-panel>
    {% if user.login_method == LOGIN_METHOD_PASSWORD %}
      <section data-settings-section="password">
        {% include "base/_partials/_collapsible_header.html" with section="" title="Password" %}
        <div class="collapsible-body">
          <form data-role="password-form">
            <div class="form-group">
              <label for="id_current_pw">{{ S.PASSWORD_CURRENT }}</label>
              <input type="password" id="id_current_pw"
                     name="current_password" required>
            </div>
            <div class="form-group">
              <label for="id_pw1">{{ S.PASSWORD_NEW }}</label>
              <input type="password" id="id_pw1" name="password1" required>
            </div>
            <div class="form-group">
              <label for="id_pw2">{{ S.PASSWORD_REPEAT }}</label>
              <input type="password" id="id_pw2" name="password2" required>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-save">{{ S.SAVE }}</button>
            </div>
          </form>
          <p class="mt-1" data-role="password-msg"></p>
        </div>
      </section>
    {% endif %}
    {% if user.role == ROLE_ADMIN %}
      {% include "impostazioni/_entity_section.html" with key="users" title="Utenti" %}
    {% endif %}
    <section data-settings-section="landing-page">
      {% include "base/_partials/_collapsible_header.html" with section="" title="Pagina iniziale" %}
      <div class="collapsible-body">
        <form class="settings-source-form"
              data-role="landing-page-form"
              data-success-label="{{ S.LANDING_PAGE_SAVED }}">
          <div class="form-group">
            <label for="id_landing_page">{{ S.LABEL_LANDING_PAGE }}</label>
            <input type="text" id="id_landing_page" name="landing_page"
                   data-role="landing-page" placeholder="/prelievi"
                   autocomplete="off">
          </div>
          <div class="form-group" data-role="default-landing-page-row" hidden>
            <label for="id_default_landing_page">Pagina default</label>
            <input type="text" id="id_default_landing_page"
                   name="default_landing_page"
                   data-role="default-landing-page" placeholder="/prelievi"
                   autocomplete="off">
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-save">{{ S.SAVE }}</button>
          </div>
        </form>
        <p class="mt-1" data-role="landing-page-msg"></p>
      </div>
    </section>

    {% if user.role == ROLE_ADMIN %}
      <section data-settings-section="satellite-credentials">
        {% include "base/_partials/_collapsible_header.html" with section="" title=S.SATELLITE_CREDENTIALS %}
        <div class="collapsible-body">
          <form autocomplete="off">
            <fieldset class="satellite-credential-fields" disabled>
              <div class="form-group">
                <label for="satellite-client-id">{{ S.SATELLITE_CLIENT_ID }}</label>
                <input type="text" id="satellite-client-id" name="client_id" maxlength="255" required>
              </div>
              <div class="form-group">
                <label for="satellite-client-secret">{{ S.SATELLITE_CLIENT_SECRET }}</label>
                <input type="password" id="satellite-client-secret" name="client_secret"
                       autocomplete="new-password" maxlength="4096">
              </div>
              <button type="button" class="btn" name="test">{{ S.SATELLITE_TEST_CREDENTIALS }}</button>
              <div class="form-actions">
                <button type="submit" class="btn btn-save">{{ S.SAVE }}</button>
                <button type="button" class="btn btn-delete" name="remove" disabled>{{ S.SATELLITE_REMOVE_CREDENTIALS }}</button>
              </div>
            </fieldset>
          </form>
          <p class="mt-1" role="status"></p>
        </div>
      </section>
    {% endif %}
    <footer class="settings-footer text-muted">
      {% if user.role == ROLE_ADMIN and ABIES_VERSION %}
        <p>Versione software: <code>{{ ABIES_VERSION }}</code></p>
      {% endif %}
      <p>Icone di <a href="https://www.flaticon.com/authors/th-studio">th studio</a> da Flaticon.com.</p>
      <p>Dati LiDAR da <a href="https://doi.org/10.13127/tinitaly/1.1">INGV TINITALY 1.1</a>
        (Tarquini et al., 2023 · <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>).</p>
      <p lang="en">Contains modified <a href="https://dataspace.copernicus.eu/">Copernicus Sentinel data</a> since 2015.</p>
      <p lang="en">Dávid D.Kovács, Jan Musial, Jędrzej Bojanowski, Dennis Clarijs, Jurry de la Mar, and András Zlinszky.
        <cite>Copernicus Data Space Ecosystem establishes public cloud processing for earth observation data.</cite>
        <i>Scientific Data</i> 13, 537 (2026). <a href="https://doi.org/10.1038/s41597-026-06765-8">10.1038/s41597-026-06765-8</a>.</p>
    </footer>
  </div>

  {% if user.can_modify %}
    <div id="settings-dati-di-base" class="settings-forms" data-settings-panel hidden>
      {% if user.role == ROLE_ADMIN %}
        <div class="settings-cluster">
          {% include "impostazioni/_entity_section.html" with key="observation-categories" title="Categorie di osservazioni" usage_note="Puoi eliminare le categorie che non sono usate in osservazioni esistenti." %}
          {% include "impostazioni/_entity_section.html" with key="road-types" title="Tipi di viabilità" usage_note="Puoi eliminare i tipi di viabilità che non sono assegnati a strade o sentieri esistenti." %}
          {% include "impostazioni/_entity_section.html" with key="eclasses" title="Classi economiche" hide_active_filter=True usage_note="Se una classe è assegnata a una particella, puoi modificarne il nome e la descrizione, ma non puoi eliminarla o cambiare il valore «Ceduo»." %}
        </div>
      {% endif %}
      <div class="settings-cluster">
        <section data-settings-section="species" data-settings-entity>
          {% include "base/_partials/_collapsible_header.html" with section="" title="Specie" %}
          <div class="collapsible-body">
            <div class="table-toolbar" data-role="equation-toolbar">
              <div class="equation-transfer-actions">
                <div class="equation-transfer-row" role="group" aria-labelledby="species-equation-import-label">
                  <span id="species-equation-import-label">{{ S.EQUATION_IMPORT_LABEL }}</span>
                  <button type="button" class="btn btn-import" data-action="import-height">{{ S.EQUATION_KIND_HEIGHT }}</button>
                  <button type="button" class="btn btn-import" data-action="import-volume">{{ S.EQUATION_KIND_VOLUME }}</button>
                </div>
                <div class="equation-transfer-row" role="group" aria-labelledby="species-equation-export-label">
                  <span id="species-equation-export-label">{{ S.EQUATION_EXPORT_LABEL }}</span>
                  <button type="button" class="btn btn-export" data-action="export-height">{{ S.EQUATION_KIND_HEIGHT }}</button>
                  <button type="button" class="btn btn-export" data-action="export-volume">{{ S.EQUATION_KIND_VOLUME }}</button>
                </div>
              </div>
              <input type="file" accept=".csv" data-role="equation-import-file" hidden>
              <label class="active-toggle ms-auto">
                <input type="checkbox" data-role="active-toggle" checked>
                Solo attivi
              </label>
            </div>
            <div data-target="table-host"></div>
            {% include "impostazioni/_species_equation_tools.html" %}
          </div>
        </section>

        <section data-settings-section="dendrometry">
          {% include "base/_partials/_collapsible_header.html" with section="" title="Parametri dendrometrici" %}
          <div class="collapsible-body">
            <p class="settings-summary" data-role="dendrometry-counts">
              N. alberi: <span data-field="trees">0</span> ·
              Comprese: <span data-field="regions">0</span> ·
              Particelle: <span data-field="parcels">0</span>
            </p>
            <form class="settings-source-form"
                  data-role="dendrometry-form"
                  data-success-label="Impostazioni aggiornate.">
              <div class="form-group">
                <label for="dendrometry-surveys">Rilevamenti</label>
                <select id="dendrometry-surveys"
                        multiple
                        size="6"
                        data-role="dendrometry-surveys"
                        data-loading-label="Caricamento..."
                        data-empty-label="Nessun rilevamento disponibile."></select>
              </div>
              <div class="form-actions">
                <button type="submit" class="btn btn-save">{{ S.SAVE }}</button>
              </div>
            </form>
            <p class="mt-1" data-role="dendrometry-msg"></p>
          </div>
        </section>

        <section data-settings-section="diameter-classes">
          {% include "base/_partials/_collapsible_header.html" with section="" title="Classi diametriche" %}
          <div class="collapsible-body">
            <p class="settings-summary">Le classi diametriche sono:</p>
            <form class="settings-source-form"
                  data-role="diameter-classes-form"
                  data-success-label="Classi diametriche aggiornate.">
              <div class="settings-radio-list">
                <label class="settings-radio-option">
                  <input type="radio" name="diameter_class_mode" value="centered">
                  <span>centrate: la classe 20 comprende i diametri 18–22 cm.</span>
                </label>
                <label class="settings-radio-option">
                  <input type="radio" name="diameter_class_mode" value="shifted_up">
                  <span>spostate verso l’alto: la classe 20 comprende i diametri 20–24 cm.</span>
                </label>
                <label class="settings-radio-option">
                  <input type="radio" name="diameter_class_mode" value="shifted_down">
                  <span>spostate verso il basso: la classe 20 comprende i diametri 16–20 cm.</span>
                </label>
              </div>
              <div class="form-actions">
                <button type="submit" class="btn btn-save">{{ S.SAVE }}</button>
              </div>
            </form>
            <p class="mt-1" data-role="diameter-classes-msg"></p>
          </div>
        </section>
      </div>
      <div class="settings-cluster">
        {% include "impostazioni/_entity_section.html" with key="tractors" title="Mezzi" %}
      </div>
    </div>

    <div id="settings-cartografia" data-settings-panel hidden>
      <div class="map-workspace cartography-layout">
        <div id="cartography-map" class="map-workspace-host">
          <div class="cartography-map-tools" data-role="map-tools" hidden>
            <div class="cartography-buttons" data-role="draw-tools">
              <button class="btn cartography-map-icon" data-action="line" aria-label="Linea" title="Linea" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 18 10 6l10 8"/><path class="cartography-tool-vertices" d="M4 18h.01M10 6h.01M20 14h.01"/>
                </svg>
              </button>
              <button class="btn cartography-map-icon" data-action="polygon" aria-label="Poligono" title="Poligono" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m4 17 4-12 12 4-3 10Z"/><path class="cartography-tool-vertices" d="M4 17h.01M8 5h.01M20 9h.01M17 19h.01"/>
                </svg>
              </button>
            </div>
            <button class="btn cartography-map-icon" data-action="undo" title="Annulla ultimo passo"
                    aria-label="Annulla ultimo passo" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5-5 5 5 5M4 10h10a6 6 0 0 1 0 12"/></svg>
            </button>
            <button class="btn cartography-map-icon" data-action="remove-vertex" title="Rimuovi vertice"
                    aria-label="Rimuovi vertice" hidden disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 3v7m4-7v7"/></svg>
            </button>
            <button class="btn cartography-map-icon" data-action="break-link" title="Interrompi al vertice"
                    aria-label="Interrompi al vertice" hidden disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 11-3 3a3.5 3.5 0 0 0 5 5l3-3m-2-8 3-3a3.5 3.5 0 0 1 5 5l-3 3M5 7l2-2m10 14 2-2M9 5l1-2m10 11 2-1"/></svg>
            </button>
            <button class="btn cartography-map-icon" data-action="join-link" title="Unisci estremi"
                    aria-label="Unisci estremi" aria-pressed="false" hidden disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 11-3 3a3.5 3.5 0 0 0 5 5l3-3m-2-8 3-3a3.5 3.5 0 0 1 5 5l-3 3m-7 2 6-6"/></svg>
            </button>
            <button class="btn cartography-map-icon cartography-follow-icon" data-action="follow-boundary"
                    title="Segui confine" aria-label="Segui confine" aria-pressed="false" hidden disabled></button>
            <button class="btn cartography-map-icon" data-action="cancel" title="{{ S.CANCEL }}"
                    aria-label="{{ S.CANCEL }}" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
            </button>
            <button class="btn btn-save cartography-map-icon" data-action="finish" title="Termina"
                    aria-label="Termina" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>
            </button>
            <button class="btn btn-save cartography-map-icon" data-action="save" title="{{ S.SAVE }}"
                    aria-label="{{ S.SAVE }}" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>
            </button>
          </div>
        </div>
        <aside id="cartography-sidebar" class="map-workspace-sidebar" aria-label="Controlli cartografia">
          <section class="cartography-section">
            <label for="cartography-region">Compresa</label>
            <select id="cartography-region"></select>
            <div class="cartography-sidebar-actions">
              <button class="btn" data-action="edit-region" disabled>{{ S.ACTION_PROPERTIES }}</button>
              <button class="btn btn-create" data-action="new-region" disabled>Nuova</button>
            </div>
            <p role="status" data-role="status"></p>
          </section>
          <section class="cartography-section">
            <div class="cartography-list-header" data-kind="parcel">
              <h2 id="cartography-parcels-label">Particelle</h2>
              <button class="cartography-icon cartography-eye" data-action="toggle-all"
                      aria-label="Visibilità di tutte le particelle" title="Mostra/nascondi tutte le particelle"
                      aria-pressed="false" hidden disabled></button>
            </div>
            <p class="cartography-empty" data-empty="parcel">Nessuna particella</p>
            <ul class="map-workspace-list" id="cartography-parcels"
                aria-labelledby="cartography-parcels-label" hidden></ul>
            <div class="cartography-sidebar-actions">
              <button class="btn" data-action="parcel-properties" disabled>{{ S.ACTION_PROPERTIES }}</button>
              <button class="btn" data-action="boundaries" disabled>Confini</button>
            </div>
          </section>
          <section class="cartography-section">
            <div class="cartography-list-header" data-kind="road">
              <h2 id="cartography-roads-label">Strade</h2>
              <button class="cartography-icon cartography-eye" data-action="toggle-all"
                      aria-label="Visibilità di tutte le strade" title="Mostra/nascondi tutte le strade"
                      aria-pressed="false" hidden disabled></button>
            </div>
            <p class="cartography-empty" data-empty="road">Nessuna strada</p>
            <ul class="map-workspace-list" id="cartography-roads"
                aria-labelledby="cartography-roads-label" hidden></ul>
            <div class="cartography-sidebar-actions">
              <button class="btn" data-action="road-properties" disabled>{{ S.ACTION_PROPERTIES }}</button>
              <button class="btn" data-action="points" disabled>Punti</button>
            </div>
          </section>
          <details class="cartography-section" open>
            <summary id="cartography-drawings-label">Disegni</summary>
            <div class="cartography-list-header" data-kind="drawing">
              <button class="cartography-icon cartography-eye" data-action="toggle-all"
                      aria-label="Visibilità di tutti i disegni" title="Mostra/nascondi tutti i disegni"
                      aria-pressed="false" hidden disabled></button>
              <button class="cartography-icon action-delete" data-action="clear"
                      aria-label="Elimina disegni" title="Elimina disegni" hidden disabled></button>
            </div>
            <div class="cartography-sidebar-actions cartography-drawing-entry-actions">
              <button class="btn btn-create" data-action="new-drawing" disabled>Nuovo</button>
              <button class="btn" data-action="open-import" disabled>{{ S.IMPORT_LABEL }}…</button>
            </div>
            <p class="cartography-empty" data-empty="drawing">Nessun disegno</p>
            <ul class="map-workspace-list" id="cartography-drawings"
                aria-labelledby="cartography-drawings-label" hidden></ul>
            <div class="cartography-sidebar-actions">
              <button class="btn" data-action="edit" disabled>{{ S.ACTION_EDIT }}</button>
              <button class="btn btn-save" data-action="promote" disabled>Promuovi</button>
            </div>
          </details>
          <div class="cartography-terrain">
            <button type="button" class="btn btn-save" data-action="refresh-terrain" disabled>{{ S.TERRAIN_REFRESH }}</button>
            <p class="cartography-empty" data-role="terrain-status" role="status"></p>
          </div>
        </aside>
      </div>
    </div>
  {% endif %}
</template>

<template id="tmpl-settings-select-option">
  <option></option>
</template>

<template id="tmpl-hypso-candidate">
  <div class="form-card hypso-candidate">
    <h2>Nuovi parametri ipsometrici</h2>
    <div data-target="candidate-table"></div>
    <div class="form-actions">
      <button type="button" class="btn" data-action="reject">Rifiuta</button>
      <button type="button" class="btn btn-save" data-action="accept">Accetta</button>
    </div>
  </div>
</template>

<template id="tmpl-cartography-row">
  <li class="map-workspace-list-row">
    <button class="map-workspace-list-choice cartography-item" data-action="select-item" aria-pressed="false">
      <span class="map-workspace-list-label"></span>
    </button>
    <button class="cartography-icon cartography-eye" data-action="toggle-item"
            aria-pressed="true"></button>
    <button class="cartography-icon action-delete" data-action="remove-item" disabled></button>
  </li>
</template>

<template id="tmpl-cartography-import">
  <div class="form-card cartography-import">
    <h2>Importa disegni</h2>
    <div class="modal-tabs">
      <button type="button" class="btn modal-tab" data-path="file">Da file</button>
      <button type="button" class="btn modal-tab" data-path="ipso">Da Ipso</button>
      <button type="button" class="btn modal-tab" data-path="survey">Da rilevamento</button>
    </div>
    <div class="modal-tab-bodies">
      <form class="modal-tab-body" data-path="file">
        <div class="form-group">
          <label for="cartography-file">File GeoJSON, GPX o DXF</label>
          <input id="cartography-file" type="file" name="file" accept=".geojson,.json,.gpx,.dxf" required>
        </div>
        <div class="form-group">
          <label for="cartography-import-name">{{ S.LABEL_NAME }}</label>
          <input id="cartography-import-name" type="text" name="name" maxlength="100" required>
        </div>
        <div class="form-group" data-role="dxf-crs" hidden>
          <label for="cartography-epsg">Codice EPSG del DXF</label>
          <input id="cartography-epsg" type="text" name="epsg" inputmode="numeric" pattern="[0-9]{1,6}" disabled>
        </div>
        <div class="form-actions">
          <button type="button" class="btn" data-action="cancel">{{ S.CANCEL }}</button>
          <button type="submit" class="btn btn-import">{{ S.IMPORT_LABEL }}</button>
        </div>
      </form>
      <div class="modal-tab-body" data-path="ipso">
        <div class="form-row">
          <div class="form-group">
            <label for="cartography-uploads">Nuovi rilievi</label>
            <select id="cartography-uploads"></select>
          </div>
          <button type="button" class="btn btn-import" data-action="import" disabled>{{ S.IMPORT_LABEL }}</button>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="cartography-sources">Già importati</label>
            <select id="cartography-sources"></select>
          </div>
          <div class="cartography-buttons">
            <button type="button" class="btn" data-action="restore" disabled>Importa di nuovo</button>
            <button type="button" class="btn btn-delete" data-action="forget" disabled>Elimina originale</button>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn" data-action="cancel">{{ S.CANCEL }}</button>
        </div>
      </div>
      <form class="modal-tab-body" data-path="survey">
        <div class="form-group">
          <label for="cartography-surveys">Rilevamento</label>
          <select id="cartography-surveys" name="survey_id" required></select>
        </div>
        <p role="status"></p>
        <div class="form-actions">
          <button type="button" class="btn" data-action="cancel">{{ S.CANCEL }}</button>
          <button type="submit" class="btn btn-import" disabled>{{ S.IMPORT_LABEL }}</button>
        </div>
      </form>
    </div>
  </div>
</template>

<template id="tmpl-cartography-road">
  <form class="form-card">
    <h2>Crea strada</h2>
    <div class="form-row"><div class="form-group">
      <label for="cartography-road-name">{{ S.LABEL_NAME }}</label>
      <input id="cartography-road-name" type="text" name="name" maxlength="100" required>
    </div></div>
    <div class="form-row"><div class="form-group">
      <label for="cartography-road-type">Tipo di viabilità</label>
      <select id="cartography-road-type" name="road_type_id" required></select>
    </div></div>
    <div class="form-actions">
      <button type="button" class="btn" data-action="cancel">{{ S.CANCEL }}</button>
      <button type="submit" class="btn btn-save">Crea strada</button>
    </div>
  </form>
</template>

<template id="tmpl-cartography-region">
  <div class="form-card">
    <h2></h2>
    <form>
      <div class="form-row"><div class="form-group">
        <label for="cartography-region-name">{{ S.LABEL_NAME }}</label>
        <input id="cartography-region-name" type="text" name="name" maxlength="100" required>
      </div></div>
      <div class="form-row"><div class="form-group">
        <label for="cartography-region-description">{{ S.COL_DESCRIPTION }}</label>
        <textarea id="cartography-region-description" name="description" rows="3"></textarea>
      </div></div>
      <div class="form-actions">
        <button type="button" class="btn btn-delete" data-action="delete">{{ S.ACTION_DELETE }}</button>
        <button type="button" class="btn" data-action="cancel">{{ S.CANCEL }}</button>
        <button type="submit" class="btn btn-save">{{ S.SAVE }}</button>
      </div>
    </form>
  </div>
</template>

<template id="tmpl-cartography-drawing">
  <form class="form-card">
    <h2>Nuovo disegno</h2>
    <div class="form-row"><div class="form-group">
      <label for="cartography-drawing-name">{{ S.LABEL_NAME }}</label>
      <input id="cartography-drawing-name" type="text" name="name" maxlength="100" required>
    </div></div>
    <div class="form-actions">
      <button type="button" class="btn" data-action="cancel">{{ S.CANCEL }}</button>
      <button type="submit" class="btn btn-save">{{ S.SAVE }}</button>
    </div>
