<div class="form-card">
  <form id="settings-form">
    <input type="hidden" name="row_id" value="{{ obj.id|default_if_none:'' }}">
    <input type="hidden" name="version" value="{{ obj.version|default:'1' }}">

    <h2>{% if obj %}Modifica categoria{% else %}Nuova categoria{% endif %}</h2>

    <div class="form-group">
      <label for="id_category_name">Nome</label>
      <input type="text" id="id_category_name" name="name" required
             value="{{ obj.name|default:'' }}">
    </div>

    <div class="form-group">
      <label for="id_category_sort_order">Ordine</label>
      <input type="number" id="id_category_sort_order" name="sort_order" required
             value="{% if obj %}{{ obj.sort_order }}{% else %}0{% endif %}">
    </div>

    <div class="form-group">
      <label>
        <input type="hidden" name="active" value="false">
        <input type="checkbox" name="active" value="true"
               {% if obj.active or not obj %}checked{% endif %}>
        Attivo
      </label>
    </div>

    <div class="form-actions">
      <button type="button" class="btn" data-action="cancel">{{ S.CANCEL }}</button>
      <button type="submit" class="btn btn-save">{{ S.SAVE }}</button>
    </div>
  </form>
</div>
