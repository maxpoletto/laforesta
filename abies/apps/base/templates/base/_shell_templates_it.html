{% comment %}
Shared <template> elements cloned by JS — dialogs and tree dendrometry.
Rendered once inside the shell; never displayed directly.
{% endcomment %}

<template id="tmpl-confirm-modal">
  <p data-field="message"></p>
  <div class="form-actions">
    <button type="button" class="btn" data-action="cancel">{{ S.CANCEL }}</button>
    <button type="button" class="btn" data-action="confirm"></button>
  </div>
</template>

<template id="tmpl-cascade-delete-modal">
  <h2 class="cascade-confirm-title" data-field="title"></h2>
  <p class="cascade-confirm-warning" data-field="warning"></p>
  <p data-field="export-required"></p>
  <div class="form-actions">
    <button type="button" class="btn" data-action="cancel">{{ S.CANCEL }}</button>
    <button type="button" class="btn btn-export" data-action="export">{{ S.EXPORT }}</button>
    <button type="button" class="btn btn-delete"
            data-action="delete" disabled>{{ S.ACTION_DELETE }}</button>
  </div>
</template>

<template id="tmpl-tree-dendrometry-summary">
  <section class="tree-dendrometry-summary">
    <div class="tree-dendrometry-summary-header">
      <h3>{{ S.SECTION_DENDROMETRIC_SUMMARY }}</h3>
      <button type="button" class="btn btn-export"
              data-action="export-dendrometry">{{ S.EXPORT }}</button>
    </div>
    <p class="subsection-note" data-target="dendrometry-status" hidden></p>
    <div class="dendrometry-species-row" data-target="dendrometry-species-row">
      <span class="dendrometry-species-label">{{ S.COL_SPECIES }}:</span>
      <div class="dendrometry-species-legend" data-target="dendrometry-species"></div>
    </div>
    <div class="dendrometry-chart-grid" data-target="dendrometry-chart-grid">
      <div class="dendrometry-chart-panel">
        <h3>{{ S.BOSCO_TREE_COUNT }}</h3>
        <div class="dendrometry-chart-canvas">
          <canvas data-target="dendrometry-tree-count-chart"></canvas>
        </div>
        <div class="dendrometry-chart-info" data-target="dendrometry-tree-count-info"></div>
      </div>
      <div class="dendrometry-chart-panel">
        <h3>{{ S.DENDROMETRY_VOLUME }}</h3>
        <div class="dendrometry-chart-canvas">
          <canvas data-target="dendrometry-volume-chart"></canvas>
        </div>
        <div class="dendrometry-chart-info" data-target="dendrometry-volume-info"></div>
      </div>
      <div class="dendrometry-chart-panel">
        <h3>{{ S.DENDROMETRY_BASAL_AREA }}</h3>
        <div class="dendrometry-chart-canvas">
          <canvas data-target="dendrometry-basal-area-chart"></canvas>
        </div>
        <div class="dendrometry-chart-info" data-target="dendrometry-basal-area-info"></div>
      </div>
    </div>
  </section>
</template>
