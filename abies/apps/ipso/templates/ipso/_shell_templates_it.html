{% comment %}
Ipso <template> elements - cloned by JS on mount().
Static Italian text lives here; JS wires controls and fills dynamic data.
{% endcomment %}

<template id="tmpl-ipso-inbox-page">
  <div class="ipso-inbox-page">
    <div class="ipso-inbox-header">
      <h1>Importazione</h1>
      <div class="ipso-inbox-summary" data-role="summary"></div>
    </div>

    <div data-role="table"></div>
    <section class="ipso-upload-detail" data-role="detail" hidden></section>
  </div>
</template>

<template id="tmpl-ipso-upload-mode-modal">
  <form class="form-card" data-role="ipso-upload-mode-form">
    <h2>Modifica modalità</h2>
    <div class="form-group">
      <label for="id_ipso_upload_mode">Modalità</label>
      <select id="id_ipso_upload_mode" name="{{ FIELD_MODE }}" data-role="mode" required>
        {% for option in IPSO_UPLOAD_MODE_OPTIONS %}
        <option value="{{ option.value }}">{{ option.label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-actions">
      <button type="button" class="btn" data-action="cancel">{{ S.CANCEL }}</button>
      <button type="submit" class="btn btn-save">{{ S.SAVE }}</button>
    </div>
  </form>
</template>

<template id="tmpl-ipso-import-review-modal">
  <div class="ipso-import-review">
    <h2>Controlla importazione</h2>
    <p data-field="summary"></p>
    <p class="form-help" data-field="message"></p>
    <p class="csv-import-errors ipso-review-lines" data-field="errors"></p>
    <p class="form-help ipso-review-lines" data-field="warnings"></p>
    <p data-field="export-required"></p>
    <div class="form-actions">
      <button type="button" class="btn" data-action="cancel">{{ S.CANCEL }}</button>
      <button type="button" class="btn btn-export" data-action="export"></button>
      <button type="button" class="btn btn-save" data-action="confirm" disabled></button>
    </div>
  </div>
</template>
